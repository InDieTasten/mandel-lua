name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Lua and LuaRocks
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
        
    - name: Install busted testing framework
      run: |
        sudo luarocks install busted
        
    - name: Run tests
      run: |
        busted